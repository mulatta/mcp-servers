[project]
name = "mcp-servers-workspace"
version = "0.1.0"
description = "Python workspace for personal MCP servers"
authors = [
  { name = "mulatta", email = "67085791+mulatta@users.noreply.github.com" },
]
requires-python = ">=3.13,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp_servers/linkedin"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
